<style>
/* Layout: one console column. Setup and mini-games use a CRT screen; the cruise is a cockpit: window on top, instrument panels below. */
:root {
  --void: #110e1d;      /* night sky behind the console */
  --panel: #1b1630;     /* screen glass */
  --metal: #241e3a;     /* cockpit panel plate */
  --line: #3b3158;      /* bezel rules */

  --dim: #a99a7a;       /* secondary text */
  --mars: #e4582d;      /* rust accent */
  --ice: #7fd3dd;       /* telemetry cyan */
  --ok: #95d67c;
  --bad: #ff6b5a;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-readout: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--void); color: var(--phos); font: 15px/1.55 var(--font-body); padding-inline: max(16px, env(safe-area-inset-left, 0px)); touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
.cockpit, .mg, canvas, button, .tile { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#app { max-width: 980px; margin: 0 auto; padding-block: 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.logo { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.08em; color: var(--mars); }
.bar-right { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 13px; }
#screen { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px; position: relative; min-height: 420px; box-shadow: inset 0 0 60px rgba(0,0,0,0.45); }
#screen.bare { background: transparent; border: 0; padding: 0; box-shadow: none; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(36px, 8vw, 64px); color: var(--mars); letter-spacing: 0.04em; }
h2 { font-size: 22px; color: var(--phos); }
h3 { font-size: 16px; color: var(--ice); }
p { margin: 0; max-width: 70ch; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--dim); }
.small { font-size: 13px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
.btn { font: 600 14px var(--font-body); color: var(--phos); background: transparent; border: 1px solid var(--phos); border-radius: 3px; padding: 9px 14px; cursor: pointer; }
@media (hover: hover) { .btn:hover:not(:disabled) { background: rgba(242,196,109,0.12); } .btn.primary:hover:not(:disabled) { background: #ffd88c; } .pick:hover:not(:disabled) { border-color: var(--phos); } }
.btn:focus-visible, input:focus-visible, select:focus-visible, .pick:focus-visible, .pbtn:focus-visible, .lever:focus-visible, .stick:focus-visible, .tile:focus-visible, .task:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.btn.primary { background: var(--phos); color: var(--void); }
.btn.danger { border-color: var(--mars); color: var(--mars); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.tiny { padding: 4px 9px; font-size: 13px; }
input[type=text], select { font: 15px var(--font-body); background: var(--void); color: var(--phos); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
input[type=text] { width: 100%; box-sizing: border-box; }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.pick { text-align: left; font: inherit; color: inherit; background: var(--void); border: 1px solid var(--line); border-radius: 4px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.pick.sel { border-color: var(--ice); box-shadow: 0 0 0 1px var(--ice); background: #0f1824; }
.pick:disabled { opacity: 0.4; cursor: not-allowed; }
.pick .name { font-family: var(--font-display); font-size: 15px; color: var(--phos); }
.pick .head { display: flex; gap: 12px; align-items: center; }
.portrait { image-rendering: pixelated; border-radius: 4px; border: 1px solid var(--line); flex: none; background: #241d3d; }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin: 0; }
.spec dt { color: var(--dim); } .spec dd { margin: 0; font-variant-numeric: tabular-nums; }
.perk { font-size: 12.5px; } .perk.plus { color: var(--ok); } .perk.minus { color: var(--bad); }
.readout { font-family: var(--font-readout); font-size: 26px; line-height: 1; color: var(--ice); font-variant-numeric: tabular-nums; }
.good { color: var(--ok); } .warn { color: var(--phos); } .bad { color: var(--bad); }

.title { display: flex; flex-direction: column; gap: 18px; }
.title canvas { width: 100%; height: auto; max-width: 100%; border-radius: 4px; background: #07060d; }
.lede { font-size: 16px; }

.store { width: 100%; border-collapse: collapse; font-size: 14px; }
.store th { text-align: left; font-weight: 400; } .store td, .store th { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.store td.num, .store th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qty { display: inline-flex; align-items: center; gap: 6px; }
.qty span { min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.meter { height: 8px; background: var(--void); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ice); }
.meter.hot > i { background: var(--mars); }
.advisor { border-left: 3px solid var(--ice); padding: 8px 12px; background: rgba(127,211,221,0.06); font-size: 13px; }

.wx { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.wx-cell { border: 1px solid var(--line); background: var(--void); padding: 12px; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; }
.wx-cell.fail { border-color: var(--bad); }
.wx-cell .lim { font-size: 12px; color: var(--dim); }
.countdown { font-family: var(--font-readout); font-size: clamp(64px, 18vw, 120px); line-height: 1; color: var(--phos); text-align: center; font-variant-numeric: tabular-nums; }
.launch-btn { font: 700 20px var(--font-display); background: var(--mars); color: #fff; border: 4px solid #8f2e12; border-radius: 50%; width: 150px; height: 150px; cursor: pointer; align-self: center; box-shadow: 0 6px 0 #6b210c; }
.launch-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6b210c; }
.launch-btn:disabled { filter: grayscale(0.7); cursor: not-allowed; }

/* ---- cockpit ---- */
.cockpit { display: flex; flex-direction: column; gap: 0; }
.window { position: relative; border: 6px solid #2d2545; border-bottom-width: 10px; border-radius: 26px 26px 6px 6px; overflow: hidden; background: #05040a; box-shadow: 0 8px 0 #0b0914; }
.window canvas { display: block; width: 100%; height: clamp(170px, 31vh, 300px); }
.window::before, .window::after { content: ""; position: absolute; top: 0; bottom: 0; width: 6px; background: #2d2545; pointer-events: none; }
.window::before { left: 30%; } .window::after { right: 30%; }
.vp-hud { position: absolute; top: 8px; left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--font-readout); font-size: 21px; color: var(--ice); pointer-events: none; text-shadow: 0 0 6px rgba(0,0,0,0.9); z-index: 1; }
.lights { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 10px 8px 0; background: var(--metal); border-inline: 1px solid var(--line); }
.light { font: 600 11px var(--font-body); letter-spacing: 0.1em; padding: 3px 9px; border: 1px solid var(--line); border-radius: 3px; color: #5d5378; background: #100c1a; }
.light.on { color: #1b0d05; background: var(--mars); border-color: var(--mars); box-shadow: 0 0 10px var(--mars); }
.light.on.blink { animation: blink 0.9s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.console { position: relative; display: grid; grid-template-columns: 112px minmax(0, 1.15fr) minmax(0, 1fr); grid-template-areas: "thr nav sys" "thr ctl crew" "log log log"; gap: 10px; background: var(--metal); padding: 12px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; }
@media (min-width: 1000px) and (max-height: 920px) {
  #app { padding-block: 10px 24px; gap: 10px; }
  .window canvas { height: 21vh; }
  .console { grid-template-columns: 96px minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "thr nav sys crew" "thr ctl log crew"; gap: 8px; padding: 10px; }
  .lever { height: 170px; } .nav-wrap canvas { height: 118px; } .stick { width: 96px; height: 96px; }
  .p-log .log { height: 96px; } .pnl { padding: 8px; gap: 6px; }
  .ctl-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .pbtn { padding: 7px 4px 6px; }
}
@media (max-width: 999px) and (min-width: 761px) { .touch .window canvas { height: 25vh; } .touch .p-log .log { height: 100px; } }
@media (max-width: 760px) { .console { grid-template-columns: 96px minmax(0, 1fr); grid-template-areas: "thr nav" "ctl ctl" "sys sys" "crew crew" "log log"; } }
.pnl { background: #14101f; border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  background-image: radial-gradient(circle at 6px 6px, #4a4068 1.6px, transparent 2.2px), radial-gradient(circle at calc(100% - 6px) 6px, #4a4068 1.6px, transparent 2.2px), radial-gradient(circle at 6px calc(100% - 6px), #4a4068 1.6px, transparent 2.2px), radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), #4a4068 1.6px, transparent 2.2px); }
.pnl > .label { text-align: center; }
.p-thr { grid-area: thr; align-items: center; } .p-nav { grid-area: nav; } .p-sys { grid-area: sys; } .p-ctl { grid-area: ctl; } .p-crew { grid-area: crew; } .p-log { grid-area: log; }
.glass { background: #08131a; border: 1px solid #1f3a44; border-radius: 4px; box-shadow: inset 0 0 18px rgba(127,211,221,0.12); color: var(--ice); }
.lever { position: relative; height: 210px; width: 64px; touch-action: none; cursor: ns-resize; flex: none; }
.lever .slot { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 10px; transform: translateX(-50%); background: #05040a; border-radius: 5px; border: 1px solid var(--line); }
.lever .tick { position: absolute; left: 4px; right: 4px; height: 1px; background: #4a4068; }
.lever .tick.cruise { background: var(--ice); }
.lever .handle { position: absolute; left: 50%; width: 58px; height: 26px; transform: translate(-50%, 50%); background: linear-gradient(#ff7a4d, #c4471f); border-radius: 6px; box-shadow: 0 3px 0 #6b210c, inset 0 2px 0 rgba(255,255,255,0.25); }
.thr-read { font-family: var(--font-readout); font-size: 26px; line-height: 1; color: var(--phos); text-align: center; }
.nav-wrap { display: flex; gap: 10px; align-items: center; }
.nav-wrap canvas { flex: 1; min-width: 0; width: 100%; height: 150px; }
.stick { width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(#2a2340, #120e1d); border: 2px solid var(--line); position: relative; touch-action: none; flex: none; cursor: grab; }
.stick .knob { --dx: 0px; --dy: 0px; position: absolute; width: 46px; height: 46px; left: 50%; top: 50%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd88c, #b07a22); transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))); box-shadow: 0 4px 10px #000; pointer-events: none; }
.stick::before { content: ""; position: absolute; inset: 50% 8px auto; height: 1px; background: #3b3158; } .stick::after { content: ""; position: absolute; inset: 8px auto 8px 50%; width: 1px; background: #3b3158; }
.navread { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; flex-wrap: wrap; }
.ctl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.pbtn { font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; background: linear-gradient(#3a3156, #2a2342); color: var(--phos); border: 1px solid #57497e; border-radius: 6px; padding: 9px 6px 8px; box-shadow: 0 3px 0 #0c0916; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; line-height: 1.2; text-align: center; }
.pbtn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0c0916; }
.pbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.pbtn.big { background: linear-gradient(#5b4a2a, #3b2f18); border-color: #8a6f3a; }
.led { width: 8px; height: 8px; border-radius: 50%; background: #3a2a33; }
.led.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .led.amber { background: var(--phos); box-shadow: 0 0 6px var(--phos); } .led.red { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
.sys { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12.5px; align-items: center; padding: 8px 10px; margin: 0; }
.sys dt { color: #5fa6ae; } .sys dd { margin: 0; font-variant-numeric: tabular-nums; }
.mini-track { position: relative; height: 14px; margin: 8px 14px 4px; border-bottom: 1px dashed #2f5560; }
.mini-track i { position: absolute; top: 3px; width: 10px; height: 10px; border-radius: 50%; transform: translateX(-50%); }
.mini-track .e { left: 0; background: #3b8fd6; } .mini-track .m { left: 100%; background: var(--mars); } .mini-track .s { background: var(--phos); width: 8px; height: 8px; top: 4px; border-radius: 1px; }
.crewmon { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.cm { display: grid; grid-template-columns: 30px minmax(0, 1fr) 64px; gap: 8px; align-items: center; }
.cm .who { min-width: 0; line-height: 1.25; } .cm .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm.dead { opacity: 0.45; } .cm.dead .who b { text-decoration: line-through; }
.cm .tag { font-size: 11px; text-align: right; }
.log { height: 150px; overflow-y: auto; padding: 8px 10px; font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
.log .d { color: var(--dim); margin-right: 6px; font-variant-numeric: tabular-nums; }
.log .e-bad { color: var(--bad); } .log .e-good { color: var(--ok); } .log .e-note { color: var(--ice); }
.p-log .log { color: var(--phos); }
#event { position: absolute; inset: 0; background: rgba(10,8,18,0.86); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; border-radius: 6px; }
.event-box { max-width: 560px; width: 100%; background: var(--panel); border: 1px solid var(--phos); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 40px rgba(242,196,109,0.15); }
.event-box .choices { display: flex; flex-direction: column; gap: 8px; }
.event-box .choices .btn { text-align: left; }
.event-box .who-helps { font-size: 12.5px; color: var(--ok); }

/* mini-games */
.mg { display: flex; flex-direction: column; gap: 14px; }
.cv-wrap { position: relative; width: 100%; max-width: calc(var(--ar, 1.6) * (100vh - 40px)); max-width: calc(var(--ar, 1.6) * (100svh - 40px)); margin-inline: auto; }
.cv-wrap canvas { display: block; width: 100%; height: auto; max-width: 100%; background: #07060d; border: 1px solid var(--line); border-radius: 4px; touch-action: none; }
.cv-hud { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-family: var(--font-readout); font-size: 22px; color: var(--ice); pointer-events: none; gap: 10px; flex-wrap: wrap; text-shadow: 0 0 4px #000; }
.pad-ctrl { display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; justify-content: space-between; align-items: flex-end; pointer-events: none; }
.pad-ctrl .grp { display: flex; gap: 10px; }
.pad-ctrl .btn { pointer-events: auto; min-width: 72px; min-height: 64px; font-size: 24px; background: rgba(17,14,29,0.6); touch-action: none; border-radius: 10px; }
.pad-ctrl .btn.on { background: rgba(242,196,109,0.45); }
.touch .pad-ctrl, .pad-ctrl.always { display: flex; }
.helper { font-size: 12.5px; color: var(--ok); }

/* circuit puzzle */
.circuit-wrap { display: flex; align-items: center; gap: 6px; justify-content: center; }
.circuit { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; width: min(100%, 380px); }
.tile { aspect-ratio: 1; padding: 0; border: 1px solid #1f3a44; background: #08131a; border-radius: 4px; cursor: pointer; color: #31525a; display: block; }
.tile.live { color: var(--ice); background: #0b2026; }
.tile svg { width: 100%; height: 100%; display: block; }
.rail { display: grid; grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 3px; align-self: stretch; width: 22px; font-size: 18px; }
.rail span { display: flex; align-items: center; justify-content: center; }

/* cipher */
.msg { display: flex; flex-wrap: wrap; gap: 10px 4px; padding: 14px; align-items: flex-end; }
.gl { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 30px; color: var(--ok); }
.gl b { font-family: var(--font-readout); font-size: 24px; line-height: 1; height: 24px; width: 26px; text-align: center; border-bottom: 2px solid #2f5560; color: var(--phos); font-weight: 400; }
.gl.space { width: 16px; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.key { display: flex; align-items: center; gap: 6px; background: var(--void); border: 1px solid var(--line); border-radius: 4px; padding: 6px; color: var(--ok); }
.key input { width: 2.4em; text-align: center; text-transform: uppercase; padding: 6px 4px; font-family: var(--font-readout); font-size: 22px; }
.key input:disabled { color: var(--ice); opacity: 1; border-color: #1f3a44; }

/* base */
.modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.mod { border: 1px solid var(--line); background: var(--void); padding: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.mod .cnt { font-family: var(--font-readout); font-size: 28px; color: var(--ice); line-height: 1; }
.tasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.task { text-align: left; font: 13px var(--font-body); color: var(--phos); background: var(--void); border: 1px solid var(--line); border-radius: 4px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.task b { font-weight: 600; } .task .muted { font-size: 12px; }
.task.sel { border-color: var(--ice); box-shadow: 0 0 0 1px var(--ice); }
.task:disabled { opacity: 0.35; cursor: not-allowed; }
.base-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 720px) { .base-grid { grid-template-columns: minmax(0, 1fr); } }
.base-grid .log { height: 220px; background: var(--void); border: 1px solid var(--line); }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.checklist li::before { content: "[ ] "; color: var(--dim); } .checklist li.done::before { content: "[x] "; color: var(--ok); }
.checklist li.done { color: var(--ok); }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; align-items: center; margin: 0; }
.stats dt { color: var(--dim); } .stats dd { margin: 0; font-variant-numeric: tabular-nums; }

.tomb { align-self: center; text-align: center; border: 2px solid var(--dim); border-radius: 120px 120px 6px 6px; padding: 50px 30px 30px; max-width: 360px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: var(--void); }
.tomb .rip { font-family: var(--font-display); font-size: 28px; color: var(--dim); }
.fame { width: 100%; border-collapse: collapse; font-size: 14px; }
.fame td, .fame th { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; }
.fame td.num { text-align: right; font-variant-numeric: tabular-nums; }
.score { font-family: var(--font-readout); font-size: 56px; color: var(--phos); line-height: 1; }
@media (prefers-reduced-motion: reduce) { .light.on.blink { animation: none; } }
@media (max-width: 480px) { #screen { padding: 16px; } #screen.bare { padding: 0; } .nav-wrap { flex-direction: column; } .stick { width: 100px; height: 100px; } }
</style>
</head>
<body>
<main id="app">
  <header class="bar">
    <span class="logo">MARS TRAIL</span>
    <div class="bar-right"><span id="mission-clock"></span><button class="btn tiny" id="b-sound" type="button" aria-pressed="true">Sound on</button></div>
  </header>
  <section id="screen" aria-live="polite"></section>
</main>
<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);

/* ================= sound ================= */
let actx = null, soundOn = true;
function beep(f = 440, d = 0.08, type = 'square', vol = 0.035) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.start(t); o.stop(t + d + 0.02);
  } catch (e) { /* audio unavailable */ }
}
addEventListener('pointerdown', () => { if (!actx && soundOn) beep(1, 0.01, 'sine', 0.0001); }, { once: true });
$('#b-sound').onclick = () => {
  soundOn = !soundOn;
  $('#b-sound').textContent = soundOn ? 'Sound on' : 'Sound off';
  $('#b-sound').setAttribute('aria-pressed', String(soundOn));
};

/* ================= loops & input ================= */
let rafId = null, keyHandler = null;
const KEYS = {};
function stopLoops() { if (rafId) cancelAnimationFrame(rafId); rafId = null; keyHandler = null; }
function loop(fn) { // runs fn(dt) every frame until the scene changes or fn returns false
  const my = sceneId; let last = performance.now();
  const f = now => {
    if (my !== sceneId) return;
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (fn(dt) === false) return;
    if (my === sceneId) rafId = requestAnimationFrame(f);
  };
  rafId = requestAnimationFrame(f);
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); KEYS[k] = true;
  if (e.target.closest && e.target.closest('input, textarea, select, #event')) return;
  if (keyHandler !== null && ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (keyHandler && !e.repeat) keyHandler(e);
});
addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
const keyDown = (...ks) => ks.some(k => KEYS[k]);
function bindHold(el, obj, key) {
  if (!el) return;
  el.onpointerdown = e => { obj[key] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); };
  el.onpointerup = el.onpointercancel = el.onlostpointercapture = () => { obj[key] = false; el.classList.remove('on'); };
  el.oncontextmenu = e => e.preventDefault();
}

/* ================= pixel portraits ================= */
const PORTRAIT_SEEDS = { billionaire: 11, pilot: 23, scientist: 37, plumber: 41, chef: 53, medic: 67, engineer: 71, driver: 89, nerd: 97, carpenter: 103, botanist: 113, gamer: 127, cat: 7 };
function portraitTag(role, size = 64) { return `<canvas class="portrait" width="${size}" height="${size}" data-portrait="${role}" aria-hidden="true" style="width:${size}px;height:${size}px"></canvas>`; }
function drawPortraits() { $$('canvas[data-portrait]').forEach(cv => drawPortrait(cv, cv.dataset.portrait)); }
function drawPortrait(cv, role) {
  const ctx = cv.getContext('2d'), P = cv.width / 16, rng = mulberry32(PORTRAIT_SEEDS[role] || 5);
  const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x * P), Math.round(y * P), Math.ceil(w * P), Math.ceil(h * P)); };
  px(0, 0, 16, 16, '#241d3d');
  if (role === 'cat') {
    px(4, 5, 8, 7, '#e08a3c'); px(4, 3, 2, 2, '#e08a3c'); px(10, 3, 2, 2, '#e08a3c'); px(6, 7, 1, 1, '#1a1a1a'); px(9, 7, 1, 1, '#1a1a1a');
    px(7, 9, 2, 1, '#f3a0a0'); px(5, 6, 6, 1, '#c76f28'); px(3, 12, 10, 4, '#e08a3c'); px(2, 9, 2, 1, '#fff'); px(12, 9, 2, 1, '#fff'); return;
  }
  const skins = ['#f1c7a3', '#d9a273', '#a86b45', '#7a4a2e', '#5a3420', '#e8b896'];
  const hairs = ['#2b1d14', '#5b3a1e', '#c89a4b', '#8a2f1a', '#d8d0c0', '#1a1a2a'];
  const skin = skins[Math.floor(rng() * skins.length)], hair = hairs[Math.floor(rng() * hairs.length)];
  const body = { billionaire: '#22222c', pilot: '#6b4a2b', scientist: '#e8e6df', plumber: '#2f5fa8', chef: '#f0ece2', medic: '#e8e6df', engineer: '#d86f1e', driver: '#c62f2f', nerd: '#3c7d4a', carpenter: '#8a5a2b', botanist: '#4f7a3a', gamer: '#3a2a5a' }[role] || '#555';
  px(2, 13, 12, 3, body); px(7, 11, 2, 2, skin); px(5, 4, 6, 7, skin);
  px(5, 3, 6, 2, hair); if (rng() > 0.4) { px(4, 4, 1, 4, hair); px(11, 4, 1, 4, hair); }
  px(6, 7, 1, 1, '#111'); px(9, 7, 1, 1, '#111'); px(7, 9, 2, 1, '#7a3b2e');
  switch (role) {
    case 'billionaire': px(7, 13, 2, 3, '#c33'); px(6, 13, 1, 1, '#fff'); px(9, 13, 1, 1, '#fff'); break;
    case 'pilot': px(5, 7, 6, 1, '#151515'); px(4, 2, 8, 2, '#3d4a2e'); px(3, 4, 4, 1, '#3d4a2e'); px(3, 14, 1, 2, '#d9b45a'); break;
    case 'scientist': px(5, 3, 6, 1, '#7fd3dd'); px(4, 3, 1, 1, '#555'); px(11, 3, 1, 1, '#555'); px(6, 14, 1, 2, '#7fd3dd'); break;
    case 'plumber': px(4, 2, 8, 2, '#1d3a6b'); px(3, 4, 5, 1, '#1d3a6b'); px(6, 9, 4, 1, hair); px(11, 13, 1, 3, '#9aa0a8'); px(10, 13, 3, 1, '#9aa0a8'); break;
    case 'chef': px(5, 0, 6, 3, '#fff'); px(4, 2, 8, 1, '#fff'); px(5, 3, 6, 1, '#ddd'); break;
    case 'medic': px(7, 13, 2, 3, '#e33'); px(6, 14, 4, 1, '#e33'); px(4, 3, 8, 1, '#fff'); px(7, 2, 2, 1, '#e33'); break;
    case 'engineer': px(4, 2, 8, 2, '#f2c41d'); px(3, 4, 10, 1, '#f2c41d'); break;
    case 'driver': px(4, 2, 8, 7, '#c62f2f'); px(5, 6, 6, 2, '#7fd3dd'); px(4, 4, 8, 1, '#fff'); break;
    case 'nerd': px(5, 7, 2, 1, '#eee'); px(9, 7, 2, 1, '#eee'); px(5, 6, 6, 1, '#111'); px(4, 7, 1, 1, '#111'); px(11, 7, 1, 1, '#111'); break;
    case 'carpenter': px(4, 3, 8, 1, '#2a6cb0'); px(11, 5, 1, 3, '#f2c46d'); px(3, 14, 2, 1, '#bbb'); break;
    case 'botanist': px(3, 3, 10, 1, '#d9b45a'); px(5, 1, 6, 2, '#d9b45a'); px(11, 12, 2, 2, '#5fae4a'); px(12, 11, 1, 1, '#5fae4a'); break;
    case 'gamer': px(4, 5, 1, 3, '#a77bf6'); px(11, 5, 1, 3, '#a77bf6'); px(4, 2, 8, 1, '#a77bf6'); px(3, 9, 2, 1, '#a77bf6'); break;
  }
}

function titleScreen() {
  stopLoops(); setClock('');
  render(`
  <div class="title">
    <canvas id="title-cv" width="880" height="260" aria-hidden="true"></canvas>
    <h1>Mars Trail</h1>
    <p class="lede">It is 2041. The Earth&ndash;Mars launch window opens in five days. Pick who leads, hire a crew of specialists, choose a ship and stock the hold. Fly launch, debris, docking, alien contact and 225 million kilometres from the cockpit. Then land, build a base, and have it ready when 12 more colonists arrive ${SURFACE_SOLS} sols later.</p>
    <div class="row">
      <button class="btn primary" id="b-new" type="button">Begin mission</button>
      <button class="btn" id="b-how" type="button">How to play</button>
      <button class="btn" id="b-fame" type="button">Hall of fame</button>
    </div>
  </div>`);
  $('#b-new').onclick = () => { beep(660); newGame(); leaderScreen(); };
  $('#b-how').onclick = howScreen;
  $('#b-fame').onclick = fameScreen;
  const cv = $('#title-cv'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.3 }));
  let t = 0;
  loop(dt => {
    t += dt;
    ctx.fillStyle = '#07060d'; ctx.fillRect(0, 0, W, H);
    for (const s of stars) { ctx.fillStyle = `rgba(255,240,210,${0.4 + 0.4 * Math.sin(t * 2 + s.x)})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
    const g = ctx.createRadialGradient(80, 200, 4, 90, 210, 46);
    g.addColorStop(0, '#9fe0ff'); g.addColorStop(0.6, '#2b6cb0'); g.addColorStop(1, '#0e2a4f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(90, 210, 44, 0, Math.PI * 2); ctx.fill();
    drawMars(ctx, W - 170, 140, 130);
    ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(242,196,109,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(130, 190); ctx.quadraticCurveTo(W / 2, -40, W - 300, 130); ctx.stroke(); ctx.setLineDash([]);
    const p = (t * 0.08) % 1, q = 1 - p;
    const x = q * q * 130 + 2 * q * p * (W / 2) + p * p * (W - 300), y = q * q * 190 + 2 * q * p * -40 + p * p * 130;
    const dx = 2 * q * (W / 2 - 130) + 2 * p * (W - 300 - W / 2), dy = 2 * q * (-40 - 190) + 2 * p * (130 + 40);
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = '#f2c46d'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-7, -5); ctx.lineTo(-7, 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(255,120,60,${0.5 + 0.5 * Math.random()})`; ctx.fillRect(-12, -2, 5, 4);
    ctx.restore();
    if (STILL) return false;
  });
}
function drawMars(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.15, x, y, r);
  g.addColorStop(0, '#ffb994'); g.addColorStop(0.55, '#c4471f'); g.addColorStop(1, '#3f1307');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(80,20,8,0.35)';
  [[-0.3, -0.23, 0.2], [0.23, 0.15, 0.14], [-0.08, 0.38, 0.26], [0.38, -0.38, 0.09]].forEach(([dx, dy, rr]) => { ctx.beginPath(); ctx.ellipse(x + dx * r, y + dy * r, rr * r, rr * r * 0.6, 0.3, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(x - r * 0.04, y - r * 0.93, r * 0.26, r * 0.07, 0, 0, Math.PI * 2); ctx.fill();
}

/* ================= launch control ================= */
function makeWeather() {
  const good = chance(0.5);
  const w = {
    wind: good ? ri(4, 26) : ri(8, 44), ceiling: good ? ri(45, 120) * 100 : ri(15, 100) * 100,
    lightning: good ? ri(14, 60) : ri(2, 40), shear: good ? pick(['Low', 'Low', 'Moderate']) : pick(['Low', 'Moderate', 'High', 'High']),
  };
  w.fails = [w.wind > 30, w.ceiling < 4000, w.lightning < 10, w.shear === 'High'];
  w.violations = w.fails.filter(Boolean).length;
  return w;
}
function launchScreen(windowDay) {
  stopLoops(); setClock(`Launch window day ${windowDay} of 5`);
  const w = makeWeather(), last = windowDay === 5;
  const cell = (name, val, lim, fail) => `<div class="wx-cell ${fail ? 'fail' : ''}"><span class="label">${name}</span><span class="readout">${val}</span><span class="lim">${lim}</span><span class="small ${fail ? 'bad' : 'good'}">${fail ? 'NO-GO' : 'GO'}</span></div>`;

    <div class="row">

function countdownScreen(w) {
  stopLoops();
  render(`
  <div class="stack" style="align-items:center;text-align:center">
    <span class="label">Final countdown</span>
    <h2>Press LAUNCH at T&minus;0</h2>

      const dmg = w.violations * ri(8, 14); G.hull -= dmg;
      wx = ` You launched into bad weather (${w.violations} limit${w.violations > 1 ? 's' : ''} broken). Buffeting on the way up cost ${dmg} hull.`;

    } else wx = ' Clear skies the whole way up.';
    G.log = [];
    log(`Liftoff from Pad 39C. ${msg}${wx}`, cls);
    beep(110, 1.2, 'sawtooth', 0.06);
    $('#cd').textContent = 'LIFTOFF';
    screenEl.querySelector('.stack').insertAdjacentHTML('beforeend', `<p class="${cls}">${msg}</p><p>${wx}</p><button class="btn primary" id="b-next" type="button">Climb to orbit</button>`);

    if (n < 0) el.textContent = 'T+' + Math.floor(-n);
    if (elapsed > 10 * step + 4000 && !pressed) { fire(); return false; }
    return !pressed;
  });
}

const STARS = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.5 + 0.4 }));
function drawSpace(ctx, W, H, scroll) {
  ctx.fillStyle = '#07060d'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,240,210,0.6)';

}
function orbitIntro() {

      if (!hits) morale(10);
      return { msg: hits ? `${hits} hit${hits > 1 ? 's' : ''}. Hull is at ${Math.max(0, G.hull)} of ${G.hullMax}.` : 'Clean run. Crew morale is up.', next: 'Begin the trans-Mars injection burn', go: startCruise };
    },

function dodgeGame(o) {
  stopLoops();
  const laser = G.s.laser > 0;
  const tips = [helps('pilot', 'debris looks slower to a trained eye.'), helps('gamer', 'the first hit is on her.'), laser ? '<span class="helper">Laser turret armed: space bar or the FIRE button.</span>' : ''].filter(Boolean).join('<br>');
  render(`

    ${tips ? `<p class="small">${tips}</p>` : ''}
    <div class="cv-wrap"><canvas id="cv" width="640" height="400"></canvas><div class="cv-hud" id="hud"></div>${laser ? '<div class="pad-ctrl always"><span class="grp"></span><span class="grp"><button class="btn" id="b-laser" type="button">FIRE</button></span></div>' : ''}</div>
    <div class="row" id="mg-row"><button class="btn primary" id="b-start" type="button">Start</button>${o.auto ? `<button class="btn" id="b-auto" type="button">${o.autoLabel}</button>` : ''}</div>
  </div>`);

  $('#b-start').focus();

function runDodge(cv, ctx, o) {
  const W = 640, H = 400, DUR = o.dur;
  const pilot = has('pilot'), gamer = has('gamer'), laser = G.s.laser > 0;
  const slow = pilot ? 0.68 : 1, shipSpeed = pilot ? 1.25 : 1;
  const ship = { x: W / 2, y: H - 70 };
  let objs = [], t = 0, spawn = 0, hits = 0, inv = 0, target = null, shield = gamer ? 1 : 0, energy = 1, beams = [], booms = [];
  const toCanvas = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  cv.onpointerdown = e => { target = toCanvas(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} };
  cv.onpointermove = e => { if (target) target = toCanvas(e); };
  cv.onpointerup = cv.onpointercancel = () => { target = null; };
  const fire = () => {
    if (!laser) return;
    const cost = gamer ? 0.12 : 0.24;
    if (energy < cost) { beep(120, 0.05); return; }
    energy -= cost; beep(1600, 0.05, 'sawtooth', 0.03);
    let hit = null;
    for (const ob of objs) if (ob.y < ship.y && Math.abs(ob.x - ship.x) < ob.r + 5 && (!hit || ob.y > hit.y)) hit = ob;
    beams.push({ x: ship.x, y0: ship.y - 16, y1: hit ? hit.y : 0, life: 0.09 });
    if (hit) { hit.dead = true; booms.push({ x: hit.x, y: hit.y, life: 0.35, r: hit.r }); }
  };
  keyHandler = e => { if (e.key === ' ') fire(); };
  if ($('#b-laser')) $('#b-laser').onpointerdown = e => { e.preventDefault(); fire(); };
  const add = () => {
    if (o.kind === 'meteor') {
      objs.push({ type: 'rock', x: rand(10, W - 10), y: -30, vx: rand(-50, 50) * slow, vy: (rand(140, 240) + t * 5) * slow, r: rand(8, 24), rot: rand(0, 6), spin: rand(-3, 3), seed: Math.random() });
      return;
    }
    const r = Math.random();
    if (r < 0.5) objs.push({ type: 'debris', x: rand(10, W - 10), y: -10, vx: rand(-40, 40) * slow, vy: (rand(170, 260) + t * 4) * slow, r: 6, rot: 0 });
    else if (r < 0.85) objs.push({ type: 'sat', x: rand(30, W - 30), y: -30, vx: rand(-30, 30) * slow, vy: (rand(100, 160) + t * 3) * slow, r: 15, rot: rand(0, 6), spin: rand(-2, 2) });
    else { const x0 = rand(-40, W * 0.4), dir = chance(0.5) ? 1 : -1; for (let i = 0; i < 6; i++) objs.push({ type: 'train', x: dir > 0 ? x0 + i * 26 : W - x0 - i * 26, y: -20 - i * 18, vx: 60 * dir * slow, vy: 140 * slow, r: 6, rot: 0 }); }
  };
  loop(dt => {
    t += dt;
    let mx = 0, my = 0;
    if (keyDown('arrowleft', 'a')) mx -= 1; if (keyDown('arrowright', 'd')) mx += 1;
    if (keyDown('arrowup', 'w')) my -= 1; if (keyDown('arrowdown', 's')) my += 1;
    if (target) { const dx = target.x - ship.x, dy = target.y - 30 - ship.y, d = Math.hypot(dx, dy); if (d > 4) { mx = dx / d * Math.min(1, d / 30); my = dy / d * Math.min(1, d / 30); } }
    ship.x = clamp(ship.x + mx * 280 * shipSpeed * dt, 14, W - 14); ship.y = clamp(ship.y + my * 220 * shipSpeed * dt, 40, H - 20);
    energy = Math.min(1, energy + (gamer ? 0.7 : 0.35) * dt);
    spawn -= dt;
    if (spawn <= 0 && t < DUR - 1.5) { add(); spawn = Math.max(0.2, (o.kind === 'meteor' ? 0.6 : 0.85) - t * 0.025) / slow; }
    for (const ob of objs) { ob.x += ob.vx * dt; ob.y += ob.vy * dt; if (ob.spin) ob.rot += ob.spin * dt; }
    objs = objs.filter(ob => !ob.dead && ob.y < H + 40 && ob.x > -60 && ob.x < W + 60);
    inv = Math.max(0, inv - dt);
    if (!inv) for (const ob of objs) if (Math.hypot(ob.x - ship.x, ob.y - ship.y) < ob.r + 9) {
      inv = 1; ob.dead = true;
      if (shield) { shield = 0; beep(500, 0.2, 'triangle'); } else { hits++; G.hull -= 8; beep(90, 0.25, 'sawtooth', 0.06); }
      break;
    }
    drawSpace(ctx, W, H, t * 60);
    if (o.kind === 'orbit') {
      const earthY = H + 260 + t * 40;
      const eg = ctx.createRadialGradient(W / 2, earthY, 200, W / 2, earthY, 480);
      eg.addColorStop(0, '#2b6cb0'); eg.addColorStop(0.92, '#1d4f8a'); eg.addColorStop(1, 'rgba(127,211,221,0.0)');
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(W / 2, earthY, 480, 0, Math.PI * 2); ctx.fill();
    }
    for (const ob of objs) {
      ctx.save(); ctx.translate(ob.x, ob.y); ctx.rotate(ob.rot);
      if (ob.type === 'sat') {
        ctx.fillStyle = '#c9c2b0'; ctx.fillRect(-5, -5, 10, 10);
        ctx.fillStyle = '#3d6fb8'; ctx.fillRect(-19, -4, 12, 8); ctx.fillRect(7, -4, 12, 8);
        ctx.strokeStyle = '#7fd3dd'; ctx.strokeRect(-19, -4, 12, 8); ctx.strokeRect(7, -4, 12, 8);
      } else if (ob.type === 'train') { ctx.fillStyle = '#e8e2d0'; ctx.fillRect(-6, -2, 12, 4); }
      else if (ob.type === 'rock') {
        ctx.fillStyle = '#8c6f58'; ctx.beginPath();

function circuitEvent() {
  showEvent({
    title: 'Electrical fault',

    ],

const NB = 1, EB = 2, SB = 4, WB = 8;
const rotMask = m => ((m << 1) | (m >> 3)) & 15;
function circuitGame() {
  stopLoops();
  const R = 5, C = 6, eng = has('engineer'), nerd = has('nerd');
  let r = ri(0, R - 1); const r0 = r, path = [];
  for (let c = 0; c < C; c++) { path.push([r, c]); if (c < C - 1) { const tr = ri(0, R - 1); while (r !== tr) { r += tr > r ? 1 : -1; path.push([r, c]); } } }
  const r1 = r;
  const dirTo = (a, b) => b[0] < a[0] ? NB : b[0] > a[0] ? SB : b[1] > a[1] ? EB : WB;
  const grid = Array.from({ length: R }, () => Array.from({ length: C }, () => ({ mask: pick([NB | SB, NB | EB, NB | EB | SB, NB | EB]), sol: null })));
  path.forEach((cell, i) => {
    const a = i === 0 ? WB : dirTo(cell, path[i - 1]), b = i === path.length - 1 ? EB : dirTo(cell, path[i + 1]);
    grid[cell[0]][cell[1]] = { mask: a | b, sol: a | b };
  });
  for (const row of grid) for (const t of row) for (let k = ri(1, 3); k > 0; k--) t.mask = rotMask(t.mask);
  let hints = nerd ? 3 : 0, timeLeft = 45 + (eng ? 20 : 0), over = false;
  render(`
  <div class="mg">
    <span class="label">Junction board &middot; main bus B</span>
    <h2>Reroute the power</h2>
    <p class="small muted">Tap a tile to rotate it. Connect the reactor bus on the left (&#9654;) to life support on the right (&#9670;). Powered tiles glow. Batteries run dry in <b id="c-time"></b> seconds.</p>
    ${eng || nerd ? `<p class="small">${[helps('engineer', '+20 seconds.'), helps('nerd', 'three hints.')].filter(Boolean).join('<br>')}</p>` : ''}
    <div class="circuit-wrap"><div class="rail">${Array.from({ length: R }, (_, i) => `<span class="${i === r0 ? 'good' : 'muted'}">${i === r0 ? '&#9654;' : ''}</span>`).join('')}</div>
      <div class="circuit" id="circuit"></div>
      <div class="rail">${Array.from({ length: R }, (_, i) => i === r1 ? '<span class="warn" id="c-target">&#9670;</span>' : '<span></span>').join('')}</div></div>
    <div class="row" id="mg-row" style="justify-content:center">${nerd ? `<button class="btn" id="b-hint" type="button">Hint (<span id="hint-n">${hints}</span>)</button>` : ''}</div>
  </div>`);
  const live = () => {
    const seen = new Set(); if (!(grid[r0][0].mask & WB)) return seen;
    const q = [[r0, 0]]; seen.add(r0 + ',0');
    const opp = { [NB]: SB, [SB]: NB, [EB]: WB, [WB]: EB }, step = { [NB]: [-1, 0], [SB]: [1, 0], [EB]: [0, 1], [WB]: [0, -1] };
    while (q.length) {
      const [y, x] = q.shift(), m = grid[y][x].mask;
      for (const d of [NB, EB, SB, WB]) if (m & d) {
        const ny = y + step[d][0], nx = x + step[d][1];
        if (ny < 0 || ny >= R || nx < 0 || nx >= C) continue;
        if (!(grid[ny][nx].mask & opp[d]) || seen.has(ny + ',' + nx)) continue;
        seen.add(ny + ',' + nx); q.push([ny, nx]);
      }
    }
    return seen;
  };
  const svg = m => { const seg = { [NB]: 'M50 50 L50 0', [EB]: 'M50 50 L100 50', [SB]: 'M50 50 L50 100', [WB]: 'M50 50 L0 50' }; return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${[NB, EB, SB, WB].filter(d => m & d).map(d => seg[d]).join(' ')}" stroke="currentColor" stroke-width="16" stroke-linecap="round" fill="none"/><circle cx="50" cy="50" r="11" fill="currentColor"/></svg>`; };
  const finish = ok => {
    over = true; stopLoops();
    let msg;
    if (ok) { morale(8); msg = `Power restored with ${Math.ceil(timeLeft)} seconds to spare. The fans spin back up.`; }
    else { G.s.o2 *= 0.8; morale(-10); alive().forEach(c => hurt(c, 6, 'a cabin fire')); msg = 'The batteries die. A small fire breaks out before the bus resets itself. Lost 20% of your O₂ and everyone inhaled smoke.'; }
    log('Electrical fault: ' + msg, ok ? 'good' : 'bad');
    $('.mg p').outerHTML = `<p class="${ok ? 'good' : 'bad'}">${msg}</p>`;
    $('#mg-row').innerHTML = '<button class="btn primary" id="b-next" type="button">Back to the cockpit</button>';
    $('#b-next').onclick = backToCockpit; $('#b-next').focus();
  };
  const draw = () => {
    const L = live(), solved = L.has(r1 + ',' + (C - 1)) && (grid[r1][C - 1].mask & EB);
    $('#circuit').innerHTML = grid.map((row, y) => row.map((t, x) => `<button class="tile ${L.has(y + ',' + x) ? 'live' : ''}" type="button" data-y="${y}" data-x="${x}" aria-label="Tile row ${y + 1} column ${x + 1}">${svg(t.mask)}</button>`).join('')).join('');
    $('#c-target').className = solved ? 'good' : 'warn';
    $$('#circuit .tile').forEach(b => b.onclick = () => { if (over) return; const t = grid[+b.dataset.y][+b.dataset.x]; t.mask = rotMask(t.mask); beep(520, 0.02); draw(); const f = $(`.tile[data-y="${b.dataset.y}"][data-x="${b.dataset.x}"]`); if (f) f.focus(); });
    if (solved && !over) { beep(880, 0.15); setTimeout(() => beep(1320, 0.25), 150); finish(true); }
  };
  if (nerd) $('#b-hint').onclick = () => {
    if (!hints || over) return;
    const wrong = path.map(([y, x]) => grid[y][x]).find(t => t.mask !== t.sol);
    if (wrong) { wrong.mask = wrong.sol; hints--; $('#hint-n').textContent = hints; if (!hints) $('#b-hint').disabled = true; draw(); }
  };
  draw();
  if (!over) loop(dt => { if (over) return false; timeLeft -= dt; $('#c-time').textContent = Math.max(0, Math.ceil(timeLeft)); if (timeLeft <= 0) { finish(false); return false; } });
}

function cipherGame() {

      while (segs.length < n) { const a = Math.floor(rng() * 9), b = Math.floor(rng() * 9); if (a !== b && !segs.some(s => (s[0] === a && s[1] === b) || (s[0] === b && s[1] === a))) segs.push([a, b]); }

  const nReveal = Math.min(letters.length - 2, Math.ceil(letters.length * 0.3) + (has('scientist') ? 3 : 0) + (has('nerd') ? 2 : 0));
  const revealed = new Set(letters.slice().sort(() => Math.random() - 0.5).slice(0, nReveal));

  const keyOrder = letters.slice().sort(() => Math.random() - 0.5);
  let timeLeft = 120, over = false;
  render(`
  <div class="mg">
    <span class="label">Open channel &middot; origin unknown</span>
    <h2>Decode the message</h2>
    <p class="small muted">Each symbol stands for one English letter. Your computer has matched a few. Type a letter next to each remaining symbol to fill in the message, then transmit it back. Wrong answers cost 10 seconds. Transmission window: <b id="ci-time"></b> s.</p>
    <div class="msg glass" id="ci-msg"></div>
    <div class="keys" id="ci-keys">${keyOrder.map(L => `<label class="key">${gsvg(L, 28)}<input type="text" maxlength="1" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next" data-i="${letters.indexOf(L)}" aria-label="Letter for symbol" ${revealed.has(L) ? `value="${L}" disabled` : ''}></label>`).join('')}</div>
    <p class="small" id="ci-msg2"></p>

  const finish = ok => {
    over = true; stopLoops();
    let txt;
    if (ok) {
      const gifts = [
        () => { G.s.fuel += 3; return 'They answer with a burst of light, and your propellant gauges climb by three pods.'; },
        () => { G.hull = G.hullMax; return 'Something passes through the ship like a warm wind. Every dent in the hull is gone.'; },
        () => { G.progress = Math.min(0.97, G.progress + 0.08); return 'Space folds. When it unfolds, Mars is noticeably closer.'; },
      ];

function drawLanding(ctx, tr, L, sim) {

function runLanding(cv, ctx, tr, sim, again) {

      const dist = onPad ? 0 : Math.round(Math.min(Math.abs(L.x - tr.padX), Math.abs(L.x - tr.padX - tr.padW)) * 3);

        const verdict = { perfect: 'Perfect. The instructor says "do that again for real."', good: 'Good landing on the pad.', rough: `Safe, but ${dist} m off the pad on a rock field. A leg would have buckled.`, hard: 'Hard landing. The crew would be hurt and cargo lost.', crash: 'Crash. In real life, nobody walks away from that.' }[out];

}

    <div class="advisor"><b>Your goal on Mars.</b> The second wave, 12 colonists, lands in <b>${SURFACE_SOLS} sols</b>. Keep your crew alive until then, and get the base ready for them: two habitat domes, and food, water, oxygen and power that cover everyone. The more of that checklist you finish, the better your ending.</div>

function workTurn() {
  const b = G.base, picked = b.picked.slice(); b.picked = [];
  for (const id of picked) {
    if (id.startsWith('build:')) {
      const k = id.slice(6), m = MODULES[k], c = modCost(k);
      if (!canBuild(k)) continue;
      G.s.kits -= c.kits; G.s.parts -= c.parts; b.mods[k]++;
      log(`Built a ${m.name.toLowerCase()}${has('carpenter') ? ', with ' + esc(who('carpenter').name) + ' framing it' : ''}.`, 'good');
      if (k === 'hab' && b.mods.hab === 1) { G.hullMax += 40; G.hull += 40; log('The crew moves out of the lander. Real beds, real walls, real radiation shielding.', 'good'); }
    } else if (id === 'repair' && G.s.parts) {
      G.s.parts--; const a = Math.round(25 * (has('carpenter') || has('engineer') ? 1.5 : 1)); G.hull = Math.min(G.hullMax, G.hull + a); log(`Repairs done. Integrity +${a}.`, 'good');
    } else if (id === 'rest') {

    } else if (id === 'call') {
      b.called = true; G.s.food += 150; G.s.water += 120; G.s.o2 += 120; G.s.kits += 2; G.s.parts += 2;
      log('The company drops a cargo pod from orbit: 150 food, 120 water, 120 O₂, 2 kits and 2 parts. Your board of directors would like a word.', 'good');
    }

  if (picked.includes('explore')) roverGame(res => { baseScreen(); applyExplore(res); finishTurn(); });
  else finishTurn();
}
function finishTurn() {
  const b = G.base;
  for (let i = 0; i < 10; i++) {
    b.sol++;
    const pr = production();
    G.s.food += pr.food; G.s.water += pr.water; G.s.o2 += pr.o2;
    consumeDay();
    if (!b.mods.hab) alive().forEach(c => hurt(c, 0.5, 'radiation exposure'));
    if (G.hull <= 0) { G.s.o2 = Math.max(0, G.s.o2 - 6); alive().forEach(c => hurt(c, 2, 'decompression')); }
    if (has('pilot')) morale(G.cat ? -0.1 : -0.3);
    if (b.storm) b.storm--;

  if (G.hull <= 0) log('Base integrity has failed. The habitat is leaking air. Repair it now.', 'bad');
  if (checkDeaths()) return;
  if (b.sol >= SURFACE_SOLS) { victory(); return; }
  if (chance(0.6)) baseEvent(); else updateBase();
}
function explore(good) {
  const opts = [];
  if (G.flags.coords && !G.flags.mars3) opts.push(3, 3, 3);
  opts.push(0, 0, 1, 1, 2);
  if (!good) opts.push(4, 5);
  const o = pick(opts), sci = has('scientist');
  if (o === 3) { G.flags.mars3 = true; G.s.parts += 3; G.bonus += 500; morale(25); log('Following the signal, the rover finds a dust-caked cone with a Soviet star: Mars 3, the lander that went silent in 1971 after 14.5 seconds. A dust devil scrubbed its panels and woke its transmitter. You salvage 3 parts kits and the first photo it never got to send. +500 score.', 'good'); }
  else if (o === 0) { const w = Math.round(ri(40, 90) * (sci ? 1.5 : 1)); G.s.water += w; log(`${sci ? 'The scientist reads the ground-penetrating radar and finds' : 'The rover finds'} buried ice in a crater wall. +${fmt(w)} crew-days of water.`, 'good'); }
  else if (o === 1) { const p = ri(1, 2) + (sci ? 1 : 0); G.s.parts += p; log(`An iron meteorite the size of a fridge. Machined into ${p} parts kit${p > 1 ? 's' : ''}.`, 'good'); }
  else if (o === 2) { morale(15); G.bonus += 100; log("You find an old rover's tracks, still crisp after decades. Somebody reads its last message aloud: \"My battery is low and it's getting dark.\" Morale up.", 'good'); }
  else if (o === 4) { const p = pick(alive()); hurt(p, 20, 'a rover accident'); log(`The rover rolls on a dune slope. ${esc(p.name)} is hurt.`, 'bad'); }
  else log('A long drive, a lot of rocks, nothing useful. The views were incredible.', '');
}
function applyExplore(res) {
  if (res.auto) { explore(false); return; }
  if (res.ice) { const w = res.ice * 15; G.s.water += w; log(`Rover expedition: ${res.ice} ice core${res.ice > 1 ? 's' : ''} collected, +${w} crew-days of water.`, 'good'); }
  if (res.crashed) { const p = pick(alive()); hurt(p, ri(10, 22), 'a rover crash'); log(`The rover flipped. ${esc(p.name)} is hurt, and the crew walked it back upright.`, 'bad'); }
  else if (res.reached) explore(true);
  else log('The rover battery died short of the waypoint. A long, cold tow home.', 'bad');
}

/* rover expedition mini-game */
function roverGame(done) {
  stopLoops();
  const driver = has('driver'), LEN = 3200, W = 640, H = 300;
  render(`
  <div class="mg">
    <span class="label">Rover expedition &middot; Sol ${G.base.sol}</span>
    <h2>Drive to the waypoint</h2>
    <p class="small muted">Right arrow or D is the throttle, left arrow or A brakes. In the air, left and right tilt the rover: land with the wheels matching the slope or it flips. Grab blue ice cores on the way. The battery lasts 45 seconds.</p>
    ${driver ? `<p class="small">${helps('driver', 'faster rover, and she can land jumps at angles that would flip anyone else.')}</p>` : ''}
    <div class="cv-wrap"><canvas id="cv" width="${W}" height="${H}"></canvas><div class="cv-hud" id="hud"></div><div class="pad-ctrl"><span class="grp"><button class="btn" id="t-b" type="button" aria-label="Brake or tilt back">&#9664;</button></span><span class="grp"><button class="btn" id="t-g" type="button" aria-label="Throttle or tilt forward">&#9654;</button></span></div></div>
    <div class="row" id="mg-row"><button class="btn primary" id="b-start" type="button">Start driving</button><button class="btn" id="b-auto" type="button">Send it on autopilot</button></div>
  </div>`);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const hs = []; const ph = rand(0, 6);
  for (let i = 0; i <= LEN / 10 + 80; i++) hs.push(200 + 26 * Math.sin(i * 0.045 + ph) + 14 * Math.sin(i * 0.13 + ph * 2));
  for (let k = 0; k < 7; k++) { const at = ri(40 + k * 40, 60 + k * 42); for (let j = 0; j < 14; j++) hs[at + j] -= j * 3.2; for (let j = 0; j < 4; j++) hs[at + 14 + j] -= (3 - j) * 10; }
  const gy = x => { const i = clamp(Math.floor(x / 10), 0, hs.length - 2), f = clamp(x / 10 - i, 0, 1); return hs[i] * (1 - f) + hs[i + 1] * f; };
  const slope = x => Math.atan2(gy(x + 6) - gy(x - 6), 12);
  const ice = Array.from({ length: 10 }, (_, i) => { const x = 250 + i * 290 + rand(-60, 60); return { x, y: gy(x) - (chance(0.4) ? 70 : 24), got: false }; });
  const R = { x: 60, y: gy(60), vy: 0, v: 0, air: false, ang: slope(60) };
  const VMAX = driver ? 250 : 185, TOL = driver ? 0.95 : 0.6, GR = 260;
  let t = 0, got = 0, running = false, over = false;
  const hold = {}; bindHold($('#t-b'), hold, 'b'); bindHold($('#t-g'), hold, 'g');
  keyHandler = () => {};
  $('#b-auto').onclick = () => done({ auto: true });
  $('#b-start').onclick = () => { running = true; $('#b-start').disabled = true; $('#b-auto').disabled = true; focusPlay(); };
  const finish = res => {
    over = true; stopLoops();
    const msg = res.crashed ? `Flipped! You keep ${res.ice} of ${got} ice cores.` : res.reached ? `Waypoint reached with ${got} ice core${got !== 1 ? 's' : ''}. Time to look around.` : `Battery dead with ${got} ice core${got !== 1 ? 's' : ''}.`;
    $('.mg p').outerHTML = `<p class="${res.crashed ? 'bad' : res.reached ? 'good' : 'warn'}">${msg}</p>`;
    $('#mg-row').innerHTML = '<button class="btn primary" id="b-next" type="button">Back to base</button>';
    $('#b-next').onclick = () => done(res); $('#b-next').focus();
  };
  loop(dt => {
    if (running && !over) {
      t += dt;
      const gas = keyDown('arrowright', 'd') || hold.g, brake = keyDown('arrowleft', 'a') || hold.b;
      if (!R.air) { if (gas) R.v = Math.min(VMAX, R.v + 130 * dt); if (brake) R.v = Math.max(0, R.v - 200 * dt); R.v = Math.max(0, R.v - 12 * dt); }

      R.x += R.v * dt;

      } else {

    ctx.save(); ctx.translate(R.x - cam, R.y); ctx.rotate(R.ang);

    ctx.restore();

  });
}

    <div class="row" id="mg-row"><button class="btn primary" id="b-start" type="button">Start scrubbing</button></div>
  </div>`);

      $('#mg-row').innerHTML = '<button class="btn primary" id="b-next" type="button">Back inside</button>';

}

  ];
  if (G.cat) evs.push(() => ({ title: 'Where is Sputnik?', text: 'The cat is missing. The airlock log shows nothing, but the greenhouse door is open a crack.', choices: [{ label: 'Search the base', fn: () => { morale(10); return 'Found asleep in the lettuce, purring. The crew pretends they were not worried.'; } }] }));
  if (G.flags.signal === 'replied' && !G.flags.reply2) evs.push(() => { G.flags.reply2 = true; return { title: 'The signal answers', text: 'At 03:12 the base radio wakes on 928 MHz. Played back, very slowly, is your own voice: "Hello from the crew of the ' + esc(G.ship.name) + '." Then a set of coordinates.', choices: [{ label: 'Log them for the next rover trip', fn: () => { G.flags.coords = true; return 'Somebody is going to have to go and look.'; } }] }; });
  updateBase();
  showEvent(pick(evs)());
}

/* ================= endings ================= */
function computeScore(won) {
  const crew = alive();
  let s = crew.length * 500 + crew.reduce((a, c) => a + c.health, 0) * 4;
  if (G.base) s += Object.values(G.base.mods).reduce((a, v) => a + v, 0) * 150 + G.base.sol * 5;
  s += (G.s.food + G.s.water + G.s.o2) / 10 + G.s.parts * 20 + G.s.med * 10 + (G.cat ? 200 : 0) + G.bonus;
  if (won) s += readiness().filter(r => r[1]).length * 400;
  else s = s * 0.25 + G.day * 2;
  return Math.round(s * G.lead.mult);
}
function recordScore(outcome, score) { const list = loadFame(); list.push({ name: G.leader, outcome, score }); list.sort((a, b) => b.score - a.score); saveFame(list.slice(0, 8)); }
function victory() {
  stopLoops(); setClock(`Sol ${G.base.sol}`);
  const crew = alive(), ready = readiness(), done = ready.filter(r => r[1]).length, score = computeScore(true);
  const tier = done === 5 ? 'Colony founded' : done >= 3 ? 'Outpost holds' : 'Survivors';
  recordScore(`${tier} · ${crew.length} of ${G.crew.length} crew`, score);
  beep(523, 0.15); setTimeout(() => beep(659, 0.15), 160); setTimeout(() => beep(784, 0.3), 320);
  const fallen = G.crew.filter(c => !c.alive);
  const story = done === 5 ? 'They walk into a base that is already a home: two domes, a greenhouse full of potatoes, fresh water and air for everyone. Mars has its first colony.'
    : done >= 3 ? 'The base can hold them, mostly. Some will sleep in their lander for a while, but the outpost will grow.'
    : 'Your crew made it, barely. The new arrivals bring their own supplies and quietly get to work fixing what you could not.';
  render(`
  <div class="stack">
    <span class="label">Sol ${G.base.sol} &middot; ${tier}</span>
    <h2>The second wave has landed</h2>
    <p>Twelve new colonists climb down and walk over to ${esc(G.leader.split(' ').pop())} Station. ${crew.map(c => esc(c.name)).join(', ')} ${crew.length > 1 ? 'are' : 'is'} waiting at the airlock${G.cat ? ', with Sputnik the cat supervising' : ''}. ${story}</p>
    <ul class="checklist">${ready.map(([t, ok]) => `<li class="${ok ? 'done' : ''}">${t}</li>`).join('')}</ul>
    <p>${G.day} days in space, ${G.base.sol} sols on Mars, ${crew.length} of ${G.crew.length} people alive.${G.flags.mars3 ? ' The Mars 3 lander is on display in the habitat.' : ''}</p>
    ${fallen.length ? `<p class="muted">In memory of ${fallen.map(c => `${esc(c.name)} (${esc(c.cause)}, ${esc(c.diedOn)})`).join('; ')}.</p>` : ''}
    <div class="row" style="align-items:baseline"><span class="score">${fmt(score)}</span><span class="muted small">points &middot; ${G.lead.name} &times;${G.lead.mult}</span></div>
    <div class="row"><button class="btn primary" id="b-again" type="button">Fly again</button><button class="btn" id="b-fame" type="button">Hall of fame</button></div>
  </div>`);
  $('#b-again').onclick = () => { newGame(); leaderScreen(); };
  $('#b-fame').onclick = fameScreen;
}
function gameOver(text, outcome, cause) {
  stopLoops(); G.running = false;
  setClock(G.base ? `Sol ${G.base.sol}` : G.day ? `Mission day ${G.day}` : '');
  const score = computeScore(false);
  recordScore(outcome, score);
  const ldr = G.crew.find(c => c.leader) || { name: G.leader };
  const why = cause || ldr.cause || 'the void';
  const when = ldr.diedOn === 'landing' ? 'Landing day, Mars' : ldr.diedOn ? `${ldr.diedOn[0].toUpperCase() + ldr.diedOn.slice(1)}${G.base ? ', Mars' : ''}` : G.base ? `Sol ${G.base.sol}, Mars` : `Day ${G.day}, ${(TOTAL_KM * Math.min(1, G.progress)).toFixed(0)} million km from Earth`;
  beep(196, 0.4, 'triangle'); setTimeout(() => beep(147, 0.7, 'triangle'), 420);
  render(`
  <div class="stack" style="align-items:center;text-align:center">
    <div class="tomb"><span class="rip">R.I.P.</span><b>${esc(ldr.name)}</b><span class="muted small">${why === 'the void' ? 'lost to the void' : 'died of ' + esc(why)}</span><span class="small muted">${when}</span></div>
    <p>${text}</p>
    <div class="row" style="justify-content:center;align-items:baseline"><span class="score">${fmt(score)}</span><span class="muted small">points</span></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="b-again" type="button">Try again</button><button class="btn" id="b-title" type="button">Title screen</button></div>
  </div>`);
  $('#b-again').onclick = () => { newGame(); leaderScreen(); };
  $('#b-title').onclick = titleScreen;
}

titleScreen();
</script>
</body>
</html>
