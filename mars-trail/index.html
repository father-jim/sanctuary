<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mars Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one console column, a mission-control CRT bezel around a single screen that swaps scenes. */
:root {
  --void: #110e1d;      /* night sky behind the console */
  --panel: #1b1630;     /* screen glass */
  --line: #3b3158;      /* bezel rules */
  --phos: #f2c46d;      /* amber phosphor text */
  --dim: #a99a7a;       /* secondary text */
  --mars: #e4582d;      /* rust accent */
  --ice: #7fd3dd;       /* telemetry cyan */
  --ok: #95d67c;
  --bad: #ff6b5a;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-readout: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--void);
  color: var(--phos);
  font: 15px/1.55 var(--font-body);
  padding-inline: 16px;
}
#app { max-width: 920px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.logo { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.08em; color: var(--mars); }
.bar-right { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 13px; }
#screen { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px; position: relative; min-height: 420px; box-shadow: inset 0 0 60px rgba(0,0,0,0.45); }
#screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 6px;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(36px, 8vw, 64px); color: var(--mars); letter-spacing: 0.04em; }
h2 { font-size: 22px; color: var(--phos); }
h3 { font-size: 16px; color: var(--ice); }
p { margin: 0; max-width: 68ch; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--dim); }
.small { font-size: 13px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
.btn { font: 600 14px var(--font-body); color: var(--phos); background: transparent; border: 1px solid var(--phos); border-radius: 3px; padding: 9px 14px; cursor: pointer; }
.btn:hover:not(:disabled) { background: rgba(242,196,109,0.12); }
.btn:focus-visible, input:focus-visible, select:focus-visible, .pick:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.btn.primary { background: var(--phos); color: var(--void); }
.btn.primary:hover:not(:disabled) { background: #ffd88c; }
.btn.danger { border-color: var(--mars); color: var(--mars); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.tiny { padding: 4px 9px; font-size: 13px; }
.btn.on { background: var(--ice); color: var(--void); border-color: var(--ice); }
input[type=text], select { font: 15px var(--font-body); background: var(--void); color: var(--phos); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
input[type=text] { width: 100%; box-sizing: border-box; }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.pick { text-align: left; font: inherit; color: inherit; background: var(--void); border: 1px solid var(--line); border-radius: 4px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.pick:hover:not(:disabled) { border-color: var(--phos); }
.pick.sel { border-color: var(--ice); box-shadow: 0 0 0 1px var(--ice); }
.pick:disabled { opacity: 0.4; cursor: not-allowed; }
.pick .name { font-family: var(--font-display); font-size: 15px; color: var(--phos); }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.spec dt { color: var(--dim); } .spec dd { margin: 0; font-variant-numeric: tabular-nums; }
.readout { font-family: var(--font-readout); font-size: 26px; line-height: 1; color: var(--ice); font-variant-numeric: tabular-nums; }
.good { color: var(--ok); } .warn { color: var(--phos); } .bad { color: var(--bad); }

/* title */
.title { display: flex; flex-direction: column; gap: 18px; }
.title canvas { width: 100%; height: auto; max-width: 100%; border-radius: 4px; background: #07060d; }
.lede { font-size: 16px; }

/* store */
.store { width: 100%; border-collapse: collapse; font-size: 14px; }
.store th { text-align: left; font-weight: 400; } .store td, .store th { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.store td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qty { display: inline-flex; align-items: center; gap: 6px; }
.qty span { min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.meter { height: 8px; background: var(--void); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ice); }
.meter.hot > i { background: var(--mars); }
.advisor { border-left: 3px solid var(--ice); padding: 8px 12px; background: rgba(127,211,221,0.06); font-size: 13px; }

/* weather board */
.wx { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.wx-cell { border: 1px solid var(--line); background: var(--void); padding: 12px; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; }
.wx-cell.fail { border-color: var(--bad); }
.wx-cell .lim { font-size: 12px; color: var(--dim); }
.countdown { font-family: var(--font-readout); font-size: clamp(64px, 18vw, 120px); line-height: 1; color: var(--phos); text-align: center; font-variant-numeric: tabular-nums; }
.launch-btn { font: 700 20px var(--font-display); background: var(--mars); color: #fff; border: 4px solid #8f2e12; border-radius: 50%; width: 150px; height: 150px; cursor: pointer; align-self: center; box-shadow: 0 6px 0 #6b210c; }
.launch-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6b210c; }
.launch-btn:disabled { filter: grayscale(0.7); cursor: not-allowed; }

/* journey */
.journey { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 720px) { .journey { grid-template-columns: minmax(0, 1fr); } }
.track { position: relative; height: 54px; border: 1px dashed var(--line); border-radius: 30px; margin-inline: 10px; }
.track .planet { position: absolute; top: 50%; width: 30px; height: 30px; border-radius: 50%; transform: translate(-50%, -50%); }
.track .earth { left: 0; background: radial-gradient(circle at 35% 35%, #9fe0ff, #2b6cb0 60%, #123a6b); }
.track .mars { left: 100%; background: radial-gradient(circle at 35% 35%, #ffb08a, #c4471f 60%, #6d2410); }
.track .ship { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 0; height: 0; border-left: 14px solid var(--phos); border-top: 7px solid transparent; border-bottom: 7px solid transparent; transition: left 0.18s linear; }
.log { height: 260px; overflow-y: auto; border: 1px solid var(--line); background: var(--void); padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.log .d { color: var(--dim); margin-right: 6px; font-variant-numeric: tabular-nums; }
.log .e-bad { color: var(--bad); } .log .e-good { color: var(--ok); } .log .e-note { color: var(--ice); }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; align-items: center; }
.stats dt { color: var(--dim); } .stats dd { margin: 0; font-variant-numeric: tabular-nums; }
.crew { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.crew-row { display: grid; grid-template-columns: minmax(0, 1fr) 80px 70px; gap: 8px; align-items: center; }
.crew-row.dead { color: var(--dim); text-decoration: line-through; }
.crew-row .tag { font-size: 11px; text-align: right; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.controls label { font-size: 13px; color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
#event { position: absolute; inset: 0; background: rgba(10,8,18,0.88); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; border-radius: 6px; }
.event-box { max-width: 560px; width: 100%; background: var(--panel); border: 1px solid var(--phos); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.event-box .choices { display: flex; flex-direction: column; gap: 8px; }
.event-box .choices .btn { text-align: left; }

/* mini-games */
.mg { display: flex; flex-direction: column; gap: 14px; }
.cv-wrap { position: relative; }
.cv-wrap canvas { display: block; width: 100%; height: auto; max-width: 100%; background: #07060d; border: 1px solid var(--line); border-radius: 4px; touch-action: none; }
.cv-hud { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-family: var(--font-readout); font-size: 22px; color: var(--ice); pointer-events: none; gap: 10px; flex-wrap: wrap; }
.pad-ctrl { display: none; gap: 10px; justify-content: center; }
.pad-ctrl .btn { min-width: 70px; min-height: 52px; font-size: 20px; user-select: none; -webkit-user-select: none; touch-action: none; }
@media (pointer: coarse) { .pad-ctrl { display: flex; } }

/* base */
.modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.mod { border: 1px solid var(--line); background: var(--void); padding: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.mod .cnt { font-family: var(--font-readout); font-size: 28px; color: var(--ice); line-height: 1; }
.tasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.task { text-align: left; font: 13px var(--font-body); color: var(--phos); background: var(--void); border: 1px solid var(--line); border-radius: 4px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.task b { font-weight: 600; }
.task .muted { font-size: 12px; }
.task.sel { border-color: var(--ice); box-shadow: 0 0 0 1px var(--ice); }
.task:disabled { opacity: 0.35; cursor: not-allowed; }

.tomb { align-self: center; text-align: center; border: 2px solid var(--dim); border-radius: 120px 120px 6px 6px; padding: 50px 30px 30px; max-width: 360px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: var(--void); }
.tomb .rip { font-family: var(--font-display); font-size: 28px; color: var(--dim); }
.fame { width: 100%; border-collapse: collapse; font-size: 14px; }
.fame td, .fame th { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; }
.fame td.num { text-align: right; font-variant-numeric: tabular-nums; }
.score { font-family: var(--font-readout); font-size: 56px; color: var(--phos); line-height: 1; }
@media (prefers-reduced-motion: reduce) { .track .ship { transition: none; } }
@media (max-width: 480px) { #screen { padding: 16px; } .crew-row { grid-template-columns: minmax(0, 1fr) 60px 60px; } }
</style>
</head>
<body>
<main id="app">
  <header class="bar">
    <span class="logo">MARS TRAIL</span>
    <div class="bar-right"><span id="mission-clock"></span><button class="btn tiny" id="b-sound" type="button" aria-pressed="true">Sound on</button></div>
  </header>
  <section id="screen" aria-live="polite"></section>
</main>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const screenEl = $('#screen');
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const render = html => { screenEl.innerHTML = html; screenEl.scrollIntoView({ block: 'nearest' }); };

/* ---------- sound ---------- */
let actx = null, soundOn = true;
function beep(f = 440, d = 0.08, type = 'square', vol = 0.035) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.start(t); o.stop(t + d + 0.02);
  } catch (e) { /* audio unavailable */ }
}
$('#b-sound').onclick = () => {
  soundOn = !soundOn;
  $('#b-sound').textContent = soundOn ? 'Sound on' : 'Sound off';
  $('#b-sound').setAttribute('aria-pressed', String(soundOn));
};

/* ---------- loops & input ---------- */
let rafId = null, tickTimer = null, keyHandler = null;
const KEYS = {};
function stopLoops() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  clearInterval(tickTimer); tickTimer = null;
  keyHandler = null;
}
addEventListener('keydown', e => {
  KEYS[e.key.toLowerCase()] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase()) && keyHandler !== null) e.preventDefault();
  if (keyHandler && !e.repeat) keyHandler(e);
});
addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
const keyDown = (...ks) => ks.some(k => KEYS[k]);

/* ---------- game data ---------- */
const BACKGROUNDS = [
  { id: 'bill', name: 'Tech billionaire', money: 2400, mult: 1, perk: 'Deep pockets. Everything else you learn on the job.' },
  { id: 'doc', name: 'Flight surgeon', money: 1500, mult: 2, perk: 'Medkits heal twice as much and your crew gets sick less often.' },
  { id: 'eng', name: 'Systems engineer', money: 1150, mult: 3, perk: 'Spare parts repair 50% more and course corrections burn less propellant.' },
];
const SHIPS = [
  { id: 'kestrel', name: 'Kestrel capsule', cost: 300, cargo: 35, hull: 70, days: 240, seats: 4, blurb: 'Cramped and cheap. Thin skin, slow transfer orbit.' },
  { id: 'ares', name: 'Ares freighter', cost: 550, cargo: 60, hull: 100, days: 210, seats: 6, blurb: 'The workhorse. Room for a full crew and a respectable base.' },
  { id: 'star', name: 'Starhopper Heavy', cost: 900, cargo: 100, hull: 130, days: 180, seats: 6, blurb: 'Huge hold, thick hull, fast trajectory. Priced to match.' },
];
const ITEMS = [
  { k: 'food', name: 'Food crate', unit: '60 crew-days', per: 60, cost: 4, mass: 0.3 },
  { k: 'water', name: 'Water tank', unit: '90 crew-days', per: 90, cost: 3, mass: 0.4 },
  { k: 'o2', name: 'O₂ canister', unit: '90 crew-days', per: 90, cost: 4, mass: 0.3 },
  { k: 'fuel', name: 'Propellant pod', unit: 'course burns & landing', per: 1, cost: 12, mass: 1.5 },
  { k: 'parts', name: 'Spare parts kit', unit: 'repairs', per: 1, cost: 8, mass: 0.3 },
  { k: 'med', name: 'Medkit', unit: 'treats one crew member', per: 1, cost: 5, mass: 0.1 },
  { k: 'kits', name: 'Hab module kit', unit: 'builds your base', per: 1, cost: 30, mass: 3 },
];
const CREW_COST = 40;
const SURFACE_SOLS = 150;
const TOTAL_KM = 225; // million km
const NAMES = ['Ada', 'Yuri', 'Mae', 'Neil', 'Sally', 'Chen', 'Valentina', 'Kalpana', 'Guion', 'Thomas', 'Peggy', 'Sunita'];
const RATIONS = { full: { label: 'Full', rate: 1, heal: 0.4 }, meager: { label: 'Meager', rate: 0.66, heal: -0.15 }, bare: { label: 'Bare bones', rate: 0.4, heal: -0.7 } };
const MODULES = {
  hab: { name: 'Habitat dome', kits: 2, parts: 1, power: 0, desc: 'Pressurized living space. Without it the crew sleeps in the lander and soaks up radiation.' },
  solar: { name: 'Solar array', kits: 1, parts: 0, power: -12, desc: '+12 kW. Dust storms cut output.' },
  greenhouse: { name: 'Greenhouse', kits: 1, parts: 1, power: 5, desc: '+3 crew-days of food per sol. Needs 5 kW.' },
  ice: { name: 'Ice extractor', kits: 1, parts: 0, power: 5, desc: '+6 crew-days of water per sol. Needs 5 kW.' },
  ox: { name: 'Oxygenator', kits: 1, parts: 0, power: 5, desc: '+6 crew-days of O₂ per sol. Needs 5 kW.' },
};

let G = null;
function newGame() {
  G = {
    leader: '', bg: null, ship: null, crew: [], money: 0,
    buy: { food: 0, water: 0, o2: 0, fuel: 0, parts: 0, med: 0, kits: 0 },
    s: { food: 0, water: 0, o2: 0, fuel: 0, parts: 0, med: 0, kits: 0 },
    hull: 0, hullMax: 0, day: 0, progress: 0, delay: 0, pace: 'cruise', rations: 'full', morale: 70,
    flags: {}, log: [], cat: false, lastEvent: 0, phase: 'setup',
    base: null, bonus: 0,
  };
}
const alive = () => G.crew.filter(c => c.alive);
const bgIs = id => G.bg && G.bg.id === id;
function hurt(p, amt, cause) { if (!p.alive) return; p.health = clamp(p.health - amt, 0, 100); if (amt > 0) p.cause = cause; }
function heal(p, amt) { if (p.alive) p.health = clamp(p.health + amt, 0, 100); }
function log(msg, cls = '') {
  const when = G.base ? `Sol ${G.base.sol}` : `Day ${G.day}`;
  G.log.push({ when, msg, cls });
  if (G.log.length > 200) G.log.shift();
  const el = $('#log');
  if (el) { el.insertAdjacentHTML('beforeend', logLine(G.log[G.log.length - 1])); el.scrollTop = el.scrollHeight; }
}
const logLine = l => `<div class="${l.cls ? 'e-' + l.cls : ''}"><span class="d">${esc(l.when)}</span>${l.msg}</div>`;
function setClock(t) { $('#mission-clock').textContent = t || ''; }

/* ---------- title ---------- */
function titleScreen() {
  stopLoops(); setClock('');
  render(`
  <div class="title">
    <canvas id="title-cv" width="880" height="260" aria-hidden="true"></canvas>
    <h1>Mars Trail</h1>
    <p class="lede">It is 2041. The Earth&ndash;Mars launch window opens in five days, and you have bought a seat on the frontier. Pick a ship, a crew and a cargo hold of supplies. Get through launch, the debris field and 225 million kilometres of nothing. Then land, build a base and keep everyone breathing for ${SURFACE_SOLS} sols until the second wave of colonists arrives.</p>
    <div class="row">
      <button class="btn primary" id="b-new" type="button">Begin mission</button>
      <button class="btn" id="b-how" type="button">How to play</button>
      <button class="btn" id="b-fame" type="button">Hall of fame</button>
    </div>
  </div>`);
  $('#b-new').onclick = () => { beep(660); newGame(); backgroundScreen(); };
  $('#b-how').onclick = howScreen;
  $('#b-fame').onclick = fameScreen;
  drawTitle();
}
function drawTitle() {
  const cv = $('#title-cv'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.3 }));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 0;
  const frame = () => {
    t += 1 / 60;
    ctx.fillStyle = '#07060d'; ctx.fillRect(0, 0, W, H);
    for (const s of stars) { ctx.fillStyle = `rgba(255,240,210,${0.4 + 0.4 * Math.sin(t * 2 + s.x)})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
    // Earth, small, left
    let g = ctx.createRadialGradient(80, 200, 4, 90, 210, 46);
    g.addColorStop(0, '#9fe0ff'); g.addColorStop(0.6, '#2b6cb0'); g.addColorStop(1, '#0e2a4f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(90, 210, 44, 0, Math.PI * 2); ctx.fill();
    // Mars, big, right
    g = ctx.createRadialGradient(W - 210, 90, 20, W - 170, 140, 150);
    g.addColorStop(0, '#ffb994'); g.addColorStop(0.55, '#c4471f'); g.addColorStop(1, '#3f1307');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W - 170, 140, 130, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(80,20,8,0.35)';
    [[-40, -30, 26], [30, 20, 18], [-10, 50, 34], [50, -50, 12]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.ellipse(W - 170 + dx, 140 + dy, r, r * 0.6, 0.3, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(W - 175, 18, 34, 9, 0, 0, Math.PI * 2); ctx.fill();
    // transfer arc + ship
    ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(242,196,109,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(130, 190); ctx.quadraticCurveTo(W / 2, -40, W - 300, 130); ctx.stroke(); ctx.setLineDash([]);
    const p = (t * 0.08) % 1, q = 1 - p;
    const x = q * q * 130 + 2 * q * p * (W / 2) + p * p * (W - 300), y = q * q * 190 + 2 * q * p * -40 + p * p * 130;
    const dx = 2 * q * (W / 2 - 130) + 2 * p * (W - 300 - W / 2), dy = 2 * q * (-40 - 190) + 2 * p * (130 + 40);
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(dy, dx));

/* ---------- launch control ---------- */
function makeWeather() {
  const good = chance(0.5);
  const w = {
    wind: good ? ri(4, 26) : ri(8, 44),
    ceiling: good ? ri(45, 120) * 100 : ri(15, 100) * 100,
    lightning: good ? ri(14, 60) : ri(2, 40),
    shear: good ? pick(['Low', 'Low', 'Moderate']) : pick(['Low', 'Moderate', 'High', 'High']),
  };
  w.fails = [w.wind > 30, w.ceiling < 4000, w.lightning < 10, w.shear === 'High'];
  w.violations = w.fails.filter(Boolean).length;
  return w;
}
function launchScreen(windowDay) {
  stopLoops(); setClock(`Launch window day ${windowDay} of 5`);
  const w = makeWeather();
  const last = windowDay === 5;
  const cell = (name, val, lim, fail) => `<div class="wx-cell ${fail ? 'fail' : ''}"><span class="label">${name}</span><span class="readout">${val}</span><span class="lim">${lim}</span><span class="small ${fail ? 'bad' : 'good'}">${fail ? 'NO-GO' : 'GO'}</span></div>`;
  render(`
  <div class="stack">
    <span class="label">Launch control &middot; Pad 39C</span>
    <h2>Weather briefing, window day ${windowDay} of 5</h2>
    <p class="small muted">The launch director looks at you. Every reading must be inside its limit for a clean launch. Scrubbing costs a day of the window.</p>
    <div class="wx">
      ${cell('Surface wind', w.wind + ' kt', 'Limit: 30 kt or less', w.fails[0])}
      ${cell('Cloud ceiling', fmt(w.ceiling) + ' ft', 'Limit: 4,000 ft or higher', w.fails[1])}
      ${cell('Lightning', w.lightning + ' nmi', 'Limit: no strikes within 10 nmi', w.fails[2])}
      ${cell('Upper-level shear', w.shear, 'Limit: not High', w.fails[3])}
    </div>
    ${last ? '<p class="small bad">This is the last day of the window. Scrub now and the mission waits 26 months for the next one.</p>' : ''}
    <div class="row">
      <button class="btn primary" id="b-go" type="button">GO for launch</button>
      <button class="btn danger" id="b-scrub" type="button">${last ? 'Scrub the mission' : 'SCRUB, try tomorrow'}</button>

  $('#b-go').onclick = () => { beep(880); countdownScreen(w); };
  $('#b-scrub').onclick = () => {

    if (last) { gameOver('The window closed with your rocket still on the pad. The investors pulled out.', 'Scrubbed'); return; }

  };

function countdownScreen(w) {
  stopLoops();
  render(`
  <div class="stack" style="align-items:center;text-align:center">
    <span class="label">Final countdown</span>
    <h2>Press LAUNCH at T&minus;0</h2>
    <p class="small muted">Too early and the hold-down clamps are still locked. Too late and the engines idle on the pad, burning propellant. Space bar works too.</p>
    <div class="countdown" id="cd">T-10</div>
    <button class="launch-btn" id="b-launch" type="button">LAUNCH</button>
  </div>`);
  const start = performance.now() + 600, step = 700; // ms per count
  let pressed = false;
  const fire = () => {
    if (pressed) return; pressed = true;
    const now = performance.now(), tZero = start + 10 * step, diff = now - tZero;
    stopLoops(); $('#b-launch').disabled = true;
    let msg, cls;
    if (diff < -250) { G.hull -= 8; msg = `You hit it ${(-diff / 1000).toFixed(1)} s early. The clamps shriek as the stack tears free. Hull &minus;8.`; cls = 'bad'; }
    else if (diff <= 350) { G.s.fuel += 1; msg = 'Perfect ignition. The flight computer banks the saved propellant: +1 propellant pod.'; cls = 'good'; }
    else if (diff <= 1500) { msg = `Ignition ${(diff / 1000).toFixed(1)} s late. Nothing lost but the director's patience.`; cls = 'warn'; }
    else { G.s.fuel = Math.max(0, G.s.fuel - 1); msg = 'Very late. The engines idled on the pad and burned off a propellant pod.'; cls = 'bad'; }
    let wx = '';
    if (w.violations) {
      const dmg = w.violations * ri(8, 14); G.hull -= dmg;
      wx = ` You launched into bad weather (${w.violations} limit${w.violations > 1 ? 's' : ''} broken). Buffeting on the way up cost ${dmg} hull.`;
      if (w.fails[2] && chance(0.5)) { const p = pick(alive()); hurt(p, 20, 'a lightning-induced electrical fire'); wx += ` A lightning strike fried a console and burned ${esc(p.name)}.`; }
    } else wx = ' Clear skies the whole way up.';
    G.log = [];
    log(`Liftoff from Pad 39C. ${msg}${wx}`, cls);
    beep(110, 1.2, 'sawtooth', 0.06);
    $('#cd').textContent = 'LIFTOFF';
    screenEl.querySelector('.stack').insertAdjacentHTML('beforeend', `<p class="${cls}">${msg}</p><p>${wx}</p><button class="btn primary" id="b-next" type="button">Climb to orbit</button>`);
    $('#b-next').onclick = orbitIntro; $('#b-next').focus();
  };
  $('#b-launch').onclick = fire;
  keyHandler = e => { if (e.key === ' ' || e.key === 'Enter') fire(); };
  let lastShown = 11;
  const tick = () => {
    const el = $('#cd'); if (!el) return;
    const elapsed = performance.now() - start;
    const n = Math.ceil(10 - elapsed / step);
    if (n !== lastShown && n >= 0) { lastShown = n; el.textContent = 'T-' + n; beep(n === 0 ? 1200 : 600, 0.06); }
    if (n < 0) el.textContent = 'T+' + Math.floor(-n);
    if (elapsed > 10 * step + 4000 && !pressed) { fire(); return; }
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

/* ---------- ascent mini-game ---------- */
function orbitIntro() {
  stopLoops(); setClock('Ascent');
  render(`
  <div class="mg">
    <span class="label">Ascent &middot; Low Earth orbit</span>
    <h2>Thread the orbital traffic</h2>
    <p class="small muted">Forty thousand satellites and a century of junk sit between you and open space. Steer with the arrow keys or WASD, or drag on the screen. Each hit costs 8 hull. Hold on for 25 seconds.</p>
    <div class="cv-wrap"><canvas id="cv" width="640" height="400"></canvas><div class="cv-hud" id="hud"></div></div>
    <div class="row"><button class="btn primary" id="b-start" type="button">Start the burn</button><button class="btn" id="b-auto" type="button">Let autopilot fly (hull &minus;15)</button></div>
  </div>`);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  drawSpace(ctx, 640, 400, 0);
  $('#b-auto').onclick = () => { G.hull -= 15; log('Autopilot flew the ascent. A clipped solar panel cost 15 hull.', 'bad'); startCruise(); };
  $('#b-start').onclick = () => { $('#b-start').disabled = true; $('#b-auto').disabled = true; runOrbit(cv, ctx); };
}
const STARS = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.5 + 0.4 }));
function drawSpace(ctx, W, H, scroll) {
  ctx.fillStyle = '#07060d'; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) { ctx.fillStyle = 'rgba(255,240,210,0.6)'; ctx.fillRect(s.x * W, ((s.y * H + scroll * s.s) % H), s.s, s.s); }
}
function runOrbit(cv, ctx) {
  const W = 640, H = 400, DUR = 25;
  const ship = { x: W / 2, y: H - 70 };
  let objs = [], t = 0, spawn = 0, hits = 0, inv = 0, last = performance.now(), target = null;
  const toCanvas = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  cv.onpointerdown = e => { target = toCanvas(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (target) target = toCanvas(e); };
  cv.onpointerup = cv.onpointercancel = () => { target = null; };
  keyHandler = () => {};
  const add = () => {
    const r = Math.random();
    if (r < 0.5) objs.push({ type: 'debris', x: rand(10, W - 10), y: -10, vx: rand(-40, 40), vy: rand(170, 260) + t * 4, r: 6, rot: 0 });
    else if (r < 0.85) objs.push({ type: 'sat', x: rand(30, W - 30), y: -30, vx: rand(-30, 30), vy: rand(100, 160) + t * 3, r: 15, rot: rand(0, 6), spin: rand(-2, 2) });
    else { const x0 = rand(-40, W * 0.4), dir = chance(0.5) ? 1 : -1; for (let i = 0; i < 6; i++) objs.push({ type: 'train', x: dir > 0 ? x0 + i * 26 : W - x0 - i * 26, y: -20 - i * 18, vx: 60 * dir, vy: 140, r: 6, rot: 0 }); }
  };
  const frame = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    // move ship
    let mx = 0, my = 0;
    if (keyDown('arrowleft', 'a')) mx -= 1; if (keyDown('arrowright', 'd')) mx += 1;
    if (keyDown('arrowup', 'w')) my -= 1; if (keyDown('arrowdown', 's')) my += 1;
    if (target) { const dx = target.x - ship.x, dy = target.y - 30 - ship.y, d = Math.hypot(dx, dy); if (d > 4) { mx = dx / d; my = dy / d; } }
    ship.x = clamp(ship.x + mx * 280 * dt, 14, W - 14); ship.y = clamp(ship.y + my * 220 * dt, 40, H - 20);
    spawn -= dt; if (spawn <= 0 && t < DUR - 1.5) { add(); spawn = Math.max(0.22, 0.85 - t * 0.025); }
    for (const o of objs) { o.x += o.vx * dt; o.y += o.vy * dt; if (o.spin) o.rot += o.spin * dt; }
    objs = objs.filter(o => o.y < H + 40 && o.x > -60 && o.x < W + 60);
    inv = Math.max(0, inv - dt);
    if (!inv) for (const o of objs) if (Math.hypot(o.x - ship.x, o.y - ship.y) < o.r + 9) { hits++; inv = 1; beep(90, 0.25, 'sawtooth', 0.06); break; }
    // draw
    drawSpace(ctx, W, H, t * 60);
    const earthY = H + 260 + t * 40; // Earth falls away below
    const eg = ctx.createRadialGradient(W / 2, earthY, 200, W / 2, earthY, 480);
    eg.addColorStop(0, '#2b6cb0'); eg.addColorStop(0.92, '#1d4f8a'); eg.addColorStop(1, 'rgba(127,211,221,0.0)');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(W / 2, earthY, 480, 0, Math.PI * 2); ctx.fill();
    for (const o of objs) {
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot);
      if (o.type === 'sat') {
        ctx.fillStyle = '#c9c2b0'; ctx.fillRect(-5, -5, 10, 10);
        ctx.fillStyle = '#3d6fb8'; ctx.fillRect(-19, -4, 12, 8); ctx.fillRect(7, -4, 12, 8);
        ctx.strokeStyle = '#7fd3dd'; ctx.strokeRect(-19, -4, 12, 8); ctx.strokeRect(7, -4, 12, 8);
      } else if (o.type === 'train') {
        ctx.fillStyle = '#e8e2d0'; ctx.fillRect(-6, -2, 12, 4);
      } else {
        ctx.fillStyle = '#8c7f6a'; ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(2, -6); ctx.lineTo(6, 2); ctx.lineTo(-2, 6); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    if (!(inv > 0 && Math.floor(t * 12) % 2)) {

  else if (o === 2) { G.morale = clamp(G.morale + 15, 0, 100); G.bonus += 100; log("You find an old rover's tracks, still crisp after decades. Somebody reads its last message aloud: \"My battery is low and it's getting dark.\" Morale up.", 'good'); }
  else if (o === 4) { const p = pick(alive()); hurt(p, 20, 'a rover accident'); log(`The rover rolls on a dune slope. ${esc(p.name)} is hurt.`, 'bad'); }
  else { log('A long drive, a lot of rocks, nothing useful. The views were incredible.', ''); }
}
function baseEvent() {
  const b = G.base, crew = alive(), p = pick(crew);
  const evs = [
    () => ({ title: 'Dust storm', text: 'A wall of dust is rolling over the horizon. It will blot out the sun for weeks and cut solar power to a third.', choices: [
      { label: 'Batten down', fn: () => { b.storm = 20; return 'The sky goes orange, then brown, then black at noon.'; } },
      { label: 'Clean the panels in the storm (risky, 1 part)', disabled: !G.s.parts, fn: () => { G.s.parts--; b.storm = 8; if (chance(0.3)) { hurt(p, 20, 'exposure in a dust storm'); return `Shorter outage, but ${esc(p.name)} got lost in the dust for an hour and came back hurt.`; } return 'Shorter outage. The crew comes in looking like terracotta statues.'; } },
    ] }),
    () => { const d = ri(15, 30); G.hull -= d; return { title: 'Hull breach', text: `A seal fails on the ${b.mods.hab ? 'habitat' : 'lander'}. Integrity &minus;${d}. You can hear the air going.`, choices: [
      { label: 'Patch it now (1 parts kit)', disabled: !G.s.parts, fn: () => { G.s.parts--; G.hull += d; return 'Sealed in 4 minutes. A new record.'; } },
      { label: 'Close the bulkhead and lose that section\'s air', fn: () => { G.s.o2 = Math.max(0, G.s.o2 - 25); return 'The bulkhead holds. 25 crew-days of O₂ vented to Mars.'; } },
    ] }; },
    () => ({ title: 'Marsquake', text: 'The ground shudders for almost a minute. InSight would have loved this one.', choices: [
      { label: 'Check the structures', fn: () => { const d = ri(5, 15); G.hull -= d; return `Some cracks. Integrity &minus;${d}.`; } },
    ] }),
    () => ({ title: `${esc(p.name)} is sick`, text: `${esc(p.name)} has been coughing for days. Probably perchlorate dust in the airlock.`, choices: [
      { label: `Use a medkit (${G.s.med} left)`, disabled: !G.s.med, fn: () => { G.s.med--; heal(p, 30 * (bgIs('doc') ? 2 : 1)); p.sick = false; return `${esc(p.name)} is breathing easier.`; } },
      { label: 'Wait it out', fn: () => { p.sick = true; return `${esc(p.name)} is confined to bed.`; } },
    ] }),
    () => b.mods.greenhouse ? ({ title: 'Crop blight', text: 'The potatoes have a white fuzz on them. It is spreading.', choices: [
      { label: 'Burn the infected trays', fn: () => { G.s.food = Math.max(0, G.s.food - 30); return 'Lost 30 crew-days of food, but the rest of the crop is safe.'; } },
      { label: 'Try to save them', fn: () => { if (chance(0.5)) return 'A UV lamp and a lot of swearing. It worked.'; b.mods.greenhouse--; return 'The blight takes the whole greenhouse. It will need rebuilding.'; } },
    ] }) : ({ title: 'Dust devil', text: 'A dust devil a kilometre tall wanders right through camp.', choices: [{ label: 'Watch it go', fn: () => { G.morale = clamp(G.morale + 5, 0, 100); return 'It scours the dust off everything. Strangely beautiful.'; } }] }),
    () => ({ title: 'Supply pod from Earth', text: 'Mission Control squeezed a small cargo pod onto a science launch. It is coming down 4 km away.', choices: [
      { label: 'Send the rover to fetch it', fn: () => { const f = ri(40, 80), o = ri(30, 60); G.s.food += f; G.s.o2 += o; G.s.med += 1; return `Inside: ${f} crew-days of food, ${o} of O₂, a medkit and a jar of real coffee.`; } },
    ] }),
    () => ({ title: 'Solar particle event', text: 'Another flare. On the surface, the planet blocks half of it. The other half is your problem.', choices: [
      { label: b.mods.hab ? 'Shelter in the habitat' : 'Shelter in the lander', fn: () => { if (b.mods.hab) return 'The regolith on the habitat roof does its job. Nobody is hurt.'; crew.forEach(c => hurt(c, ri(5, 15), 'radiation sickness')); return 'The lander walls are thin. Everyone takes a dose.'; } },
    ] }),
  ];
  if (G.flags.signal === 'replied' && !G.flags.reply2) evs.push(() => { G.flags.reply2 = true; return { title: 'The signal answers', text: 'At 03:12 the base radio wakes on 928 MHz. Played back, very slowly, is your own voice: "Hello from the crew of the ' + esc(G.ship.name) + '." Then a set of coordinates.', choices: [
    { label: 'Log them for the next rover trip', fn: () => { G.flags.coords = true; return 'Somebody is going to have to go and look.'; } },
  ] }; });
  const ev = pick(evs)();
  updateBase();
  showEvent(ev);
}

/* ---------- endings ---------- */
function computeScore(won) {
  const crew = alive();
  let s = crew.length * 500 + crew.reduce((a, c) => a + c.health, 0) * 4;
  if (G.base) s += Object.values(G.base.mods).reduce((a, v) => a + v, 0) * 150 + (G.base.sol * 5);
  s += (G.s.food + G.s.water + G.s.o2) / 10 + G.s.parts * 20 + G.s.med * 10 + (G.cat ? 200 : 0) + G.bonus;
  if (!won) s = s * 0.25 + G.day * 2;
  return Math.round(s * G.bg.mult);
}
function recordScore(outcome, score) {
  const list = loadFame();
  list.push({ name: G.leader, outcome, score });
  list.sort((a, b) => b.score - a.score);
  saveFame(list.slice(0, 8));
}
function victory() {
  stopLoops(); setClock(`Sol ${G.base.sol}`);
  const crew = alive(), score = computeScore(true);
  recordScore(`Survived · ${crew.length} of ${G.crew.length} crew`, score);
  beep(523, 0.15); setTimeout(() => beep(659, 0.15), 160); setTimeout(() => beep(784, 0.3), 320);
  const fallen = G.crew.filter(c => !c.alive);
  render(`
  <div class="stack">
    <span class="label">Sol ${G.base.sol} &middot; Arrival</span>
    <h2>The second wave has landed</h2>
    <p>Twelve new colonists climb down from their lander and walk over to ${esc(G.leader.split(' ').pop())} Station. ${crew.map(c => esc(c.name)).join(', ')} ${crew.length > 1 ? 'are' : 'is'} waiting at the airlock${G.cat ? ', with Sputnik the cat supervising' : ''}.</p>
    <p>You built ${Object.values(G.base.mods).reduce((a, v) => a + v, 0)} modules and kept ${crew.length} of ${G.crew.length} people alive for ${G.day} days in space and ${G.base.sol} sols on Mars.${G.flags.mars3 ? ' The Mars 3 lander is on display in the habitat.' : ''}</p>
    ${fallen.length ? `<p class="muted">In memory of ${fallen.map(c => `${esc(c.name)} (${esc(c.cause)}, ${esc(c.diedOn)})`).join('; ')}.</p>` : ''}
    <div class="row" style="align-items:baseline"><span class="score">${fmt(score)}</span><span class="muted small">points &middot; ${G.bg.name} &times;${G.bg.mult}</span></div>
    <div class="row"><button class="btn primary" id="b-again" type="button">Fly again</button><button class="btn" id="b-fame" type="button">Hall of fame</button></div>
  </div>`);
  $('#b-again').onclick = () => { newGame(); backgroundScreen(); };
  $('#b-fame').onclick = fameScreen;
}
function gameOver(text, outcome, cause) {
  stopLoops(); G.running = false;
  setClock(G.base ? `Sol ${G.base.sol}` : G.day ? `Mission day ${G.day}` : '');
  const score = computeScore(false);
  recordScore(outcome, score);
  const ldr = G.crew.find(c => c.leader) || { name: G.leader };
  const why = cause || ldr.cause || 'the void';
  beep(196, 0.4, 'triangle'); setTimeout(() => beep(147, 0.7, 'triangle'), 420);
  render(`
  <div class="stack" style="align-items:center;text-align:center">
    <div class="tomb"><span class="rip">R.I.P.</span><b>${esc(ldr.name)}</b><span class="muted small">${why === 'the void' ? 'lost to the void' : 'died of ' + esc(why)}</span><span class="small muted">${ldr.diedOn === 'landing' ? `Landing day, Mars` : ldr.diedOn ? `${ldr.diedOn[0].toUpperCase() + ldr.diedOn.slice(1)}${G.base ? ', Mars' : ''}` : G.base ? `Sol ${G.base.sol}, Mars` : `Day ${G.day}, ${(TOTAL_KM * Math.min(1, G.progress)).toFixed(0)} million km from Earth`}</span></div>
    <p>${text}</p>
    <div class="row" style="justify-content:center;align-items:baseline"><span class="score">${fmt(score)}</span><span class="muted small">points</span></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="b-again" type="button">Try again</button><button class="btn" id="b-title" type="button">Title screen</button></div>
  </div>`);
  $('#b-again').onclick = () => { newGame(); backgroundScreen(); };
  $('#b-title').onclick = titleScreen;
}

titleScreen();
</script>
</body>
</html>
